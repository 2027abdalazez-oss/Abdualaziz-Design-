name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Unzip Android project
        run: |
          mkdir project
          unzip -q Abdelaziz_AI_Architecture_Studio_v1_1_REAL_AI.zip -d project

      - name: Find Gradle project
        run: |
          echo "Searching for Gradle project..."
          find project -name gradlew -type f

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APK
        run: |
          GRADLEW=$(find project -name gradlew -type f | head -n 1)
          chmod +x "$GRADLEW"
          cd "$(dirname "$GRADLEW")"
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Abdelaziz-AI-Architecture-Studio-debug
          path: project/**/app/build/outputs/apk/debug/*.apk
